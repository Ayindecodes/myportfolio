<!doctype html>
<!-- Source for src/app/opengraph-image.png (1200×630). Build: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&family=Kalam:wght@400;700&family=Geist+Mono:wght@400&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f1ede4; position: relative; font-family: Kalam, cursive; }
  .eyebrow { position: absolute; left: 76px; top: 70px; font: 400 19px/1 "Geist Mono", monospace; letter-spacing: 0.2em; color: #6b6457; display: flex; align-items: center; gap: 14px; }
  .eyebrow i { width: 12px; height: 12px; border-radius: 50%; background: #8055f5; }
  svg.name { position: absolute; left: 52px; top: 118px; width: 700px; height: 240px; overflow: visible; }
  .line { position: absolute; left: 80px; top: 404px; width: 700px; font: 700 40px/1.25 Kalam, cursive; color: #141414; }
  .line u { text-decoration: none; position: relative; color: #6a3fe0; }
  .line u svg { position: absolute; left: -2%; bottom: -10px; width: 104%; height: 14px; }
  img { position: absolute; }
  .avatar { right: 30px; top: 150px; width: 380px; }
  .card { right: 286px; top: 352px; width: 230px; transform: rotate(-6deg); }
  .shackle, .lock { right: 0; top: 18px; width: 220px; }
</style>
</head>
<body>
  <!--@materials-->
  <p class="eyebrow"><i></i>FULL-STACK DEVELOPER · LAGOS</p>
  <svg class="name" viewBox="0 0 700 240" aria-label="Ayinde">
    <text x="16" y="196" font-family="Fredoka" font-weight="700" font-stretch="112%" font-size="168" letter-spacing="-5" textLength="660" lengthAdjust="spacingAndGlyphs"
          fill="#8055f5" stroke="#8055f5" stroke-width="10" stroke-linejoin="round" filter="url(#vinyl)">AYINDE</text>
  </svg>
  <p class="line">I build web apps and<br><u>the APIs behind them<svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M2 7 Q30 2.5 55 5.5 T98 4" fill="none" stroke="#8055f5" stroke-width="3.4" stroke-linecap="round"/></svg></u>, from Lagos.</p>
  <img class="avatar" src="../../src/assets/redesign/avatar.webp" alt="">
  <img class="card" src="../../src/assets/redesign/card.webp" alt="">
  <img class="shackle" src="../../src/assets/redesign/padlock-shackle.webp" alt="">
  <img class="lock" src="../../src/assets/redesign/padlock-body.webp" alt="">
</body>
</html>
