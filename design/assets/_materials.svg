<!--
  Shared materials, injected into every SVG in design/assets/ by design/render-assets.mjs (task 22).
  Lighting recipe: one distant key light from the upper left (azimuth 225°, elevation 40–52°),
  warm fill (#fff6ea), matte vinyl with a soft specular sheen. Never light objects from another angle.
-->
<defs>
    <!-- Shared vinyl material: a blurred alpha height-map lit from the upper left (azimuth 225°). -->
    <filter id="vinyl" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="height"/>
      <feDiffuseLighting in="height" surfaceScale="7" diffuseConstant="1.18" lighting-color="#fff6ea" result="diffuse">
        <feDistantLight azimuth="225" elevation="52"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>
      <feSpecularLighting in="height" surfaceScale="7" specularConstant="0.85" specularExponent="22" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="225" elevation="40"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in" result="litIn"/>
      <feComposite in="litIn" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0"/>
    </filter>

    <!-- Softer version for small parts (less blur so details keep their shape). -->
    <filter id="vinylSmall" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="height"/>
      <feDiffuseLighting in="height" surfaceScale="5" diffuseConstant="1.15" lighting-color="#fff6ea" result="diffuse">
        <feDistantLight azimuth="225" elevation="52"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>
      <feSpecularLighting in="height" surfaceScale="5" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="225" elevation="40"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in" result="litIn"/>
      <feComposite in="litIn" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.5" k4="0"/>
    </filter>

    <filter id="contactShadow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
</defs>
