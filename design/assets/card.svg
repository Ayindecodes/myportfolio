<!-- Hero prop: inflatable bank card (fintech). Card details are decorative: no real numbers or brand marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <ellipse cx="300" cy="520" rx="210" ry="22" fill="#2a2430" opacity="0.26" filter="url(#contactShadow)"/>
  <g transform="rotate(-12 300 300)">
    <rect x="86" y="160" width="428" height="276" rx="38" fill="#f6efe3" filter="url(#vinyl)"/>
    <!-- purple band -->
    <path d="M86 232 L514 232 L514 288 L86 288 Z" fill="#8055f5" opacity="0.92"/>
    <!-- chip -->
    <rect x="136" y="318" width="74" height="56" rx="12" fill="#e2bd5e" filter="url(#vinylSmall)"/>
    <g fill="none" stroke="#b08a35" stroke-width="3" stroke-linecap="round">
      <path d="M136 346 L210 346"/><path d="M160 318 L160 374"/><path d="M186 318 L186 374"/>
    </g>
    <!-- contactless waves -->
    <g fill="none" stroke="#6a3fe0" stroke-width="8" stroke-linecap="round">
      <path d="M244 330 Q256 346 244 362"/>
      <path d="M262 320 Q280 346 262 372"/>
      <path d="M280 310 Q304 346 280 382"/>
    </g>
    <!-- number placeholder pills -->
    <g fill="#d6ccb9">
      <rect x="136" y="398" width="64" height="14" rx="7"/>
      <rect x="216" y="398" width="64" height="14" rx="7"/>
      <rect x="296" y="398" width="64" height="14" rx="7"/>
      <rect x="376" y="398" width="64" height="14" rx="7"/>
    </g>
    <!-- two overlapping circles, a generic card-network mark -->
    <circle cx="430" cy="196" r="20" fill="#6a3fe0" opacity="0.85"/>
    <circle cx="456" cy="196" r="20" fill="#a993fa" opacity="0.85"/>
  </g>
</svg>
